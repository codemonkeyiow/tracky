<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Strappy</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            .accordion {
            max-width: 500px;
            margin: 20px auto;
            font-family: Arial, sans-serif;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            }

            details {
            border-bottom: 1px solid #ddd;
            }

            details:last-of-type {
            border-bottom: none;
            }

            summary {
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 600;
            background-color: #f7f7f7;
            list-style: none;
            }

            summary:hover {
            background-color: #eaeaea;
            }

            details[open] summary {
            background-color: #e2e2e2;
            }

            details p {
            padding: 12px 16px;
            margin: 0;
            background-color: #fff;
            font-size: 14px;
            line-height: 1.5;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="{% url 'admin:index' %}">Tracky</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                        <a class="nav-link" href="{% url 'drinks' %}">Drinks</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="{% url 'meals' %}">Meals</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="{% url 'all-meals' %}">All Meals</a>
                        </li>
                    </ul>
                    </div>
                </div>
            </nav>
            {% block content %}{% endblock content %}
        </div>
        {% comment %} <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> {% endcomment %}
    </body>
</html>
